<!DOCTYPE html>
<html>
<head>
<title>FashionHub</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#fff}
.logo{color:#ff3f6c;font-size:24px;font-weight:bold}
nav a{margin:0 10px;text-decoration:none;color:black}

/* Banner */
.banner{background:#ff3f6c;color:white;text-align:center;padding:40px}
.banner h1{margin:0;font-size:35px}

/* Products */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;padding:20px}
.card{background:#fff;padding:10px;text-align:center;border-radius:10px}
.card img{width:100%;height:180px;object-fit:cover}
.price{color:#ff3f6c;font-weight:bold}

/* Footer */
footer{background:#222;color:#fff;text-align:center;padding:15px;margin-top:20px}
button{background:#ff3f6c;color:#fff;border:none;padding:8px 12px;border-radius:5px}
</style>

</head>

<body>

<header>
<div class="logo">FashionHub</div>
<nav>
<a href="#">Men</a>
<a href="#">Women</a>
<a href="#">Kids</a>
</nav>
</header>

<div class="banner">
<h1>Big Sale Offer</h1>
<p>Up to 70% OFF</p>
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500">
<h3>T-Shirt</h3>
<p class="price">₹599</p>
<button>Buy</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500">
<h3>Dress</h3>
<p class="price">₹999</p>
<button>Buy</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">
<h3>Shoes</h3>
<p class="price">₹1499</p>
<button>Buy</button>
</div>

</div>

<footer>
<p>© 2026 FashionHub</p>
</footer>

</body>
</html>
