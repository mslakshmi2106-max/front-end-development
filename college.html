<!DOCTYPE html>
<html>
<head>
    <title>ABC College</title>
    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#003366;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#0055aa;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        .hero{
            text-align:center;
            padding:50px;
            background:white;
        }

        .hero h1{
            color:#003366;
        }

        .courses{
            padding:30px;
            text-align:center;
        }

        .card{
            display:inline-block;
            width:200px;
            background:white;
            margin:10px;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px lightgray;
        }

        button{
            background:#003366;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        footer{
            background:#003366;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
        }
    </style>
</head>
<body>

<header>
    <h1> M.S College of Arts and Science</h1>
    <p>Excellence in Education</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    <h1>Welcome to  M.S University
    </h1>
    <p>Admissions Open for 2026-2027</p>
    <button>Apply Now</button>
</div>

<div class="courses">
    <h2>Our Courses</h2>

    <div class="card">
        <h3>BCA</h3>
        <p>Computer Applications</p>
    </div>

    <div class="card">
        <h3>B.Sc CS</h3>
        <p>Computer Science</p>
    </div>

    <div class="card">
        <h3>B.Com</h3>
        <p>Commerce</p>
    </div>

    <div class="card">
        <h3>BBA</h3>
        <p>Business Administration</p>
    </div>
</div>

<footer>
    © 2026 ABC College of Engineering
</footer>

</body>
</html>
