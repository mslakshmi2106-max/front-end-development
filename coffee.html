<!DOCTYPE html>
<html>
<head>
<title>Coffee Shop</title>
<style>
body{
margin:0;
font-family:Arial;
text-align:center;
background:#f8f1e7;
}

.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200");
background-size:cover;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
}

button{
padding:12px 25px;
border:none;
background:#ffb347;
border-radius:25px;
font-size:16px;
cursor:pointer;
}

.menu{
display:flex;
justify-content:center;
gap:20px;
padding:30px;
}

.card{
background:white;
padding:20px;
width:150px;
border-radius:10px;
box-shadow:0 0 10px lightgray;
}
</style>
</head>
<body>

<div class="hero">
<h1>☕ Brew Heaven</h1>
<p>Fresh Coffee • Great Taste</p>
<button>Order Now</button>
</div>

<div class="menu">
<div class="card">
<h3>Latte</h3>
<p>₹180</p>
</div>

<div class="card">
<h3>Cappuccino</h3>
<p>₹200</p>
</div>

<div class="card">
<h3>Cold Coffee</h3>
<p>₹150</p>
</div>
</div>

</body>
</html>
